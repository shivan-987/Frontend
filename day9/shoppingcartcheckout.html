    <body>
        <!--step 1 : The Trigger--> 
        <div class="panel">
            <!--create the button and use inline js for trigger-->
            <button type="button" onclick="runCheckout()">Process Checkout</button>
        </div>



       <!--step 2 : Mocking API data(Obj and arrays)-->
       <script>
        function runCheckout()
        {
            let accountinfo = 
                {
                    name : "Avinash Thakur", walletBalance : 1000, isPremiumMember : true
                }

            let cartarray = [
                {itemName : "Sandals", price : 500},
                {itemName : "Coke", price : 100},
                {itemName : "Bread", price : 50}
            ]
            


            // step 3 : calculate the subtotal
            let subtotal = 0

            for(product of cartarray)
            {
                subtotal += product.price
            }

            console.log("User : Mr." + `${accountinfo.name}` + " your bill is " + `${subtotal}` + " Rs.")

            let finalTotal = calculateDiscount(subtotal, accountinfo['isPremiumMember'])
            
            //step 5: the final transaction
            if(accountinfo.walletBalance >= finalTotal)
            {
                //transaction possible
                let walletbalance = accountinfo.walletBalance - finalTotal
                console.log("transaction successful....")
                console.log(`User: Mr. ${accountinfo.name}, your bill is ${walletbalance} Rs.`);
            }
            else
            {
                //transaction not possible
                console.log("transaction failed : due to insufficient funds...Try Again")
            }

        }

        // step 4 : discount logic
        function calculateDiscount(totalAmount, isPremium)
        {
            if(isPremium)
            {
                //is a premium member, give discount 10%
                let discount = (0.1 * totalAmount)
                return totalAmount - discount
            }
            else
            {
                //no discount
                return totalAmount
            }
        }






       </script> 


    </body>
