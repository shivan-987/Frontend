        <!--CSS = cascading style sheets language

        Q2. how to insert css onto HTML:
        i. inline CSS : styles will be applied directly to the element
            eg. <h1 style="color:red;">inline styling</h1>
            IMP : interpretation => h1 element has a style attribute with a property = color and its value = red
            i.e. like HTML has elements/tags and attributes, CSS has properties:its values .
            {property:value} : each such pair is called DECLARATION.
         

        ii. internal CSS : styles will be applied to the document using <style> tag in the <head></head>

            <head>
                ....
                <style>
                    // css syntax:
                    selector{declarations}
                    i.e.
                    selector{
                    prop1:value1;
                    prop2:value2;
                    ...}
                    ..

                </style>
            </head>
            IMPP : selector defines the address where the declaration(styles) must be applied.
            "Selector is used to target the HTML elements for applying styles."

        iii. External CSS (preferable): used to apply styles to MULTIPLE WEBPAGES.
            -by creating a .css file
            -attaching the html pages using <link> tag in <head> : type link:css then press enter to get: 
            -<link rel="stylesheet" href="filename.css">
        
        IMMP : (Generally, depends on position of code for internal/inline/external link code)priority sequence for applying style on same element/selector : inline(highest) > internal > external(lowest)

                1)Simple Selectors:
                    a) element selector
                    eg. h1{
                        color:red;

                        }
                    
                    b) class selector (can apply styles for multiple elements)
                    eg. <div class="student_table">content</div>
                    .student_table
                    {
                        color:red;
                        font-family:sans-serif;
                    }
                    
                    c)id selector (can apply styles uniquely on a element)
                    eg.
                    <h1 id="example">Hello world</h1>

                    #example{
                        background-color:orange;
                    }

                2)Combinators
                3)pseudo class

        Q4. (interview Q IMPP) boxmodel (CHECK OPEN WEBPAGE AND BY RIGHT CLICK AND INSPECT and select an element, to get better idea)
            every HTML element holds 4 components
            1) content : width and height.
                eg.
                width:200px;
                height:100px;
            2) padding : space AROUND the content and WITHIN the element.
                eg. padding:50px; all sides
                    padding:10px 20px 30px 40px; top(10px space top of content) right(30px space right of content) bottom  left (like a clockwise dir) 
                    padding:10px 20px 30px; top left-right bottom
                    padding:10px 20px; top-bottom left-right
                
            3) border : a line around an element.
                border(a line): width, style, color;
                eg. border : 10px, dashed, orange;
                border-styles : solid/double/dashed/dotted/ridge/groove/none
            4) margin : space outside an element/ space between this element and other elements AROUND IT.
                (similar to padding BUT outside element unlike padding)
                eg. padding:50px; all sides
                    padding:10px 20px 30px 40px; top(10px space top of element) right(30px space right of element) bottom  left (like a clockwise dir) 
                    padding:10px 20px 30px; top left-right bottom
                    padding:10px 20px; top-bottom left-right
                
            element 1            element 2
            ------------         ------------
            | content  | margin  | content  | and all dotted lines : borders
            | padding  |        | padding  |
            ------------         ------------
