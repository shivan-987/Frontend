        <!-- <form > element
            form : main tag for the fields(each box eg. email etc)
            label : it displays the information about a field
            input : to get the field box eg. text/number/password box etc-->

        <!--few imp attributes:
        placeholder : give extra info about a field
        required : compulsory field to fill can't leave this field box ,empty
        value : to give a predefined value to a field box
        name : it acts as a key(to identify the particular field box)
        for and id : to build relations between the fields
        action : where to send the data after submission eg.some database or email etc-->

        
        <!-- new webpage-->
        <form action="">
            <!--name , for and id here relate the fields label and input for Full name-->
            <label for="un">Full Name</label><br>
            <!--type attribute defines type of field box, placeholder attribute defines what is seen on the box-->
            <input id="un" type="text" placeholder="Enter your full name" required value="john" name="urname"><br><br>

            <!--email-->
            <label for="em">Email Address</label><br>
            <input id="em" type="email" placeholder="Enter your email address"><br><br>

            <!--password-->
            <label for="pword">Password</label><br>
            <input type="password" placeholder="Create a password" id="pword" required><br><br>

            <!--confirm password-->
            <label for="cpword">Confirm Password</label><br>
            <input type="password" placeholder="Confirm your password" id="cpword" required><br><br>

            <!--gender : here <div> is acting like a header semantic tag to apply css styles-->
            <div>Gender</div><br>
            <!--radio button to choose a gender :
             name attribute(act as key) allows only 1 option to be selected(indicates all options belong to the same radio box)
             value attribute gives the predefined value
             for and id : connects the fields : input and label-->
            <input type="radio" name="gender" value="male" id="m">
            <label for="m">Male</label>

            <input type="radio" name="gender" value="female" id="f">
            <label for="f">Female</label>

            <input type="radio" name="gender" value="other" id="o">
            <label for="o">Other</label><br><br>


            <!--date of birth-->
            <label for="dob">Date Of Birth</label><br>
            <input type="date" id="dob"><br><br>

            <!--country : DROPDOWN MENU <select> tag with <option> tags-->
            <label for="cn">Country</label><br>
            <select name="country" id="cn">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="russia">Russia</option>
            </select><br><br>


            <!-- CHECKBOX : to select multiple options-->
            <div>Select Your Skills</div>
            <input type="checkbox">
            <label>HTML</label>
            <input type="checkbox">
            <label>CSS</label>
            <input type="checkbox">
            <label>JS</label><br><br>

            <!-- CHECKBOX : to select multiple options-->
            <input type="checkbox" id="cbox">
            <label for="cbox">I agree to the terms and conditions</label><br><br>


            <!--<textarea> : when you want to get a lot of info from user-->
            <label for="fback">Feedback</label><br>
            <textarea name="feedback" id="fback"></textarea><br><br>

            <!--button type=submit/reset etc-->
            <button type="submit">Register Now</button>

        </form>
