<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Asynchronous JavaScript and APIs</title>

            <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { background: #010409; color: #c9d1d9; border: 1px solid #30363d; padding: 10px 15px; border-radius: 6px; outline: none; width: 300px; height: 50px;}
        input:focus { border-color: #58a6ff; }
        button { background-color: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #2ea043; }
        
        .card { background: #161b22; border: 1px solid #30363d; width: 350px; border-radius: 10px; padding: 25px; text-align: center; display: none; /* Hidden initially */ }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 2px solid #30363d; margin-bottom: 15px; }
        h2 { color: #58a6ff; margin-bottom: 5px; }
        .bio { font-size: 14px; color: #8b949e; margin-bottom: 20px; font-style: italic; }
        .stats { display: flex; justify-content: space-around; background: #010409; padding: 15px; border-radius: 6px; border: 1px solid #30363d; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-value { font-weight: bold; font-size: 18px; color: #c9d1d9; }
        .stat-label { font-size: 12px; color: #8b949e; }
        
        #loader { color: #58a6ff; margin-bottom: 20px; display: none; font-weight: bold; }
        #error-msg { color: #f85149; margin-bottom: 20px; display: none; font-weight: bold; }
    </style>
    </head>

    <body>
        
        <!--step 1 : the UI (search and card)-->
        <div class="search-box">
            <input type="text" id="gh-username" placeholder="Enter Developer's Name...">
            <button type="button" onclick="findDeveloper()">Search For Developers</button>
        </div>

        <div id="loader">Searching Github...</div>
        <div id="error-msg">Developer not found....</div>

        <div class="card" id="devCard">
        <img src="" alt="Avatar" class="avatar" id="devAvatar">
        <h2 id="devName"></h2>
        <p class="bio" id="devBio"></p>
        <div class="stats">
        <div class="stat-item"><span class="stat-value" id="devRepos"></span><span class="stat-label">Repos</span></div>
        <div class="stat-item"><span class="stat-value" id="devFollowers"></span><span class="stat-label">Followers</span></div>
    </div>
</div>
        
    <script>
        //step 2 : async setup and UI reset

        async function findDeveloper(){
            //get username
            let username = document.getElementById('gh-username').value
            //reset UI to searching in github
            let loadermsg = document.getElementById('loader')
            let error_msg = document.getElementById('error-msg')
            let developer_info = document.getElementById('devCard')
            //hide everything except loader
            loadermsg.style.display = 'block'
            developer_info.style.display = 'none'
            error_msg.style.display = 'none'

            //step 3 : dynamic fetch request using try-catch (since async and await don't handle errors)
            try{
                //fetch API
                let apilink = `https://api.github.com/users/${username}`
                let raw_dev_data = await fetch(apilink)
                
                //if unsuccessful fetch i.e. no developer found then throw error
                if(!raw_dev_data.ok)
                {
                    throw new Error('Developer not found')
                }
                //else convert json to js object
                let developer_data = await raw_dev_data.json()

                //get the card fields
                dev_dp = document.getElementById('devAvatar')
                dev_dp.src = developer_data.avatar_url 

                dev_uname = document.getElementById('devName')
                dev_uname.innerHTML = developer_data.name || "no Name found"
                
                dev_bio = document.getElementById('devBio')
                dev_bio.innerHTML = developer_data.bio || "no Bio found"

                dev_repo = document.getElementById('devRepos')
                dev_repo.innerHTML = developer_data.public_repos

                dev_followers = document.getElementById('devFollowers')
                dev_followers.innerHTML = developer_data.followers

                //hide loader and display card
                loadermsg.style.display = 'none'
                developer_info.style.display = 'block'

                
            }
            catch(error){
                //hide loader and card, only show error msg
                loadermsg.style.display = 'none'
                developer_info.style.display = 'none'
                error_msg.style.display = 'block'
            }
        }

    </script>




    </body>




</html>
